<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Tab styling -->
    <title>Salam Diner</title>
    <link rel="icon" type="image/png" href="assets/logo.png">

    <link rel="stylesheet" href="index.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    </head>

<body>

    <div class="container">

        <header>
            <h1>Salam Diner</h1>
            <p class="restaurant-desc">The best burgers and pizzas in town.</p>
        </header>

        <section class="menu-section" id="menu-section"> </section>

        <section class="cart-section" id="cart-section">
            <h2 class="cart-title">Your order</h2>
            <ul class="cart-list" id="cart-list">  </ul>
            <button class="complete-order-btn" data-completeorder="complete">Complete order</button>
        </section>

        <form id="payment-modal">
            <h2 class="payment-title">Enter card details</h2>
            <input 
                type="text" 
                placeholder="Enter your name" 
                id="name-field" 
                name="name-field" 
                required
                >
            <input 
                type="number" 
                pattern="[0-9]{13,16}" 
                placeholder="Enter card number" 
                id="card-field" 
                name="card-field"
                aria-label="16-digit card number" 
                required
                >
            <input 
                type="number"
                min="100"
                max="999" 
                pattern="[0-9]{3}" 
                placeholder="Enter CVV" 
                id="cvv-field" 
                name="cvv-field"
                aria-label="3-digit cvv" 
                required
                >
            <button class="payment-btn" type="submit" data-pay="pay">Pay</button>
        </form>

    </div>

    <script src="index.js" type="module"></script>

</body>

</html>
